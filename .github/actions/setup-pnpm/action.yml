name: Setup pnpm

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - name: Enable corepack
      shell: bash
      run: corepack enable pnpm
    - name: Cache pnpm store
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
